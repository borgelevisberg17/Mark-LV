<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mark-LV Bridge settings</title>
<style>body{font:15px system-ui;max-width:620px;margin:40px auto;padding:0 20px;color:#202124}label{display:block;margin:20px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:6px}button{margin-top:14px;padding:10px 16px}p{line-height:1.55;color:#555}</style>
<h1>Mark-LV Browser Bridge</h1>
<p>Paste the token from <code>%USERPROFILE%\.mark-lv\browser_bridge.token</code>. Mark-LV must be running. The token authorizes this extension to exchange browser commands with the local app.</p>
<label for="token">Local bridge token</label><input id="token" type="password" autocomplete="off" spellcheck="false">
<button id="save">Save token</button><p id="status" role="status"></p>
<script src="options.js"></script></html>
