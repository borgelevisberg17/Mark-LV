name: Social UI controller tests

on:
  pull_request:
    paths:
      - "actions/social_control.py"
      - "tests/test_social_control.py"
      - ".github/workflows/test-social-controller.yml"
  push:
    branches:
      - "feat/local-social-ui-controller"
      - "feat/local-social-desktop-ui"
    paths:
      - "actions/social_control.py"
      - "tests/test_social_control.py"
      - ".github/workflows/test-social-controller.yml"

permissions:
  contents: read

jobs:
  social-controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run social controller unit tests
        run: python -m pytest -q tests/test_social_control.py
