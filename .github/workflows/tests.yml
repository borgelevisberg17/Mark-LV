name: Python tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s tests -v

  office-artifact-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Office artifact libraries
        run: python -m pip install python-docx openpyxl python-pptx Pillow reportlab
      - name: Run Office artifact integration tests
        run: python -m unittest discover -s tests -p 'test_office_actions_integration.py' -v
      - name: Test direct Office document opening and EPUB conversion
        run: python -m unittest discover -s tests -p 'test_office_documents.py' -v
